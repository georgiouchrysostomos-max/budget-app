<script>
var EUR='\u20ac';
var COLORS=['#E60000','#6A6A6A','#838383','#ACACAC','#993C1D','#444441','#A32D2D','#185FA5','#0F6E56','#D6D6D6'];
var MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
var TABS=['Budget','Advisor','Loans','Analysis','Action Plan','Investments','Settings'];
var DEFEXP=['Loan payments','Groceries','Electricity','Take-Out food','Water bill','Night out','Various'];
var DEFLOAN=[{name:'Loan 1',balance:0,rate:0,inst:0,monthly:0},{name:'Loan 2',balance:0,rate:0,inst:0,monthly:0},{name:'Loan 3',balance:0,rate:0,inst:0,monthly:0}];
var TARGETS={'Loan payments':0,'Groceries':300,'Electricity':120,'Take-Out food':100,'Water bill':50,'Night out':200,'Various':150};
var SK={h:'fh5',l:'fl5',s:'fs5',n:'fn5'};
var QA=[
  {q:'Why S&P 500 over a global fund?',a:'Buffett says put 90% in a low-cost S&P 500 index fund. US companies already generate 40-60% of revenues internationally — global exposure without extra cost. CSPX charges 0.07% vs VWCE at 0.22%. Over 30 years, that difference costs tens of thousands of euros.'},
  {q:'What does Buffett say about market timing?',a:'"The stock market is a device for transferring money from the impatient to the patient." Buy on the 20th every month regardless of market conditions. In a downturn you buy more shares for the same money — this is a feature, not a bug.'},
  {q:'Why hold bonds or cash alongside equities?',a:"Buffett's own will instructs 10% in short-term government bonds. Bonds provide a psychological anchor — when equities fall 40%, the bond portion holds steady and gives you confidence not to sell. Use German Bunds ETF (IBGS) or a high-yield savings account."},
  {q:'Should I invest when I have debt?',a:"If your debt rate exceeds expected market returns, pay debt first. For loans below 5%, minimum payments and maximum investment is rational. For rates above 5%, overpay monthly AND invest simultaneously. Do not wait until debt is clear — time in market is your most valuable asset."},
  {q:'How much will I have in 10 and 20 years?',a:'At EUR 250/month at 10% per year: Year 10 approx EUR 50,000 vs EUR 30,000 contributed. Year 20: approx EUR 189,000 vs EUR 60,000 contributed. At 3% (poor decade): EUR 34,000 at year 10. This is why you do not invest money you need within 5 years.'},
  {q:'What is the biggest mistake investors make?',a:'Selling during crashes. In March 2020 the S&P 500 fell 34% in 33 days. Investors who sold locked in that loss. Those who held recovered within 5 months and doubled by 2021. Keep your monthly buy running and do not look at your portfolio more than once per quarter.'},
  {q:'Is EUR 250/month enough?',a:"It is a solid start. EUR 250/month starting at 35 vs 45 produces roughly double the outcome by retirement — not because you invested more, but because of 10 extra years of compounding. Increase the amount by 10% every time you get a pay rise."}
];

/* ── Storage ── */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('Storage full');}}
function lsSize(){var t=0;try{Object.keys(localStorage).forEach(function(k){t+=(localStorage.getItem(k)||'').length;});}catch(e){}return t;}

/* ── Migration ── */
function migrate(){
  if(!localStorage.getItem(SK.h)){
    var hk=['fh4','fin_h3','fin_history_v3','fin_history_v2'];
    for(var i=0;i<hk.length;i++){var r=localStorage.getItem(hk[i]);if(r){try{var p=JSON.parse(r);p=p.map(function(h){if(!h.ir&&h.incomeRows)h.ir=h.incomeRows.map(function(x){return{lbl:x.label||x.lbl||'',amt:x.amount||x.amt||0};});if(!h.er&&h.expenseRows)h.er=h.expenseRows.map(function(x){return{lbl:x.label||x.lbl||'',amt:x.amount||x.amt||0};});if(!h.mo)h.mo=h.month||'';if(!h.yr)h.yr=h.year||0;if(h.rate===undefined)h.rate=0;return h;});lsSet(SK.h,p);break;}catch(e){}}}
  }
  if(!localStorage.getItem(SK.l)){
    var lk=['fl4','fin_l3','fin_loans_v3'];
    for(var j=0;j<lk.length;j++){var rl=localStorage.getItem(lk[j]);if(rl){try{var pl=JSON.parse(rl);pl=pl.map(function(l){if(l.installments!==undefined&&l.inst===undefined)l.inst=l.installments;return l;});lsSet(SK.l,pl);break;}catch(e){}}}
  }
  if(!localStorage.getItem(SK.s)){
    var sk=['fs4','fin_s3','fin_settings_v3'];
    for(var k=0;k<sk.length;k++){var rs=localStorage.getItem(sk[k]);if(rs){try{var ps=JSON.parse(rs);lsSet(SK.s,{incSources:[{lbl:'Salary',amt:ps.normalIncome||ps.sal||0},{lbl:ps.otherIncomeLabel||ps.otherLbl||'Other income',amt:ps.wifeIncome||ps.otherIncome||ps.other||0}]});break;}catch(e){}}}
  }
}

var finHistory,loans,cfg,notes;
function loadState(){
  migrate();
  finHistory=lsGet(SK.h,[]);
  loans=lsGet(SK.l,DEFLOAN);
  var rc=lsGet(SK.s,null);
  if(!rc){cfg={incSources:[{lbl:'Salary',amt:0},{lbl:'Other income',amt:0}]};}
  else if(!rc.incSources){cfg={incSources:[{lbl:'Salary',amt:rc.sal||0},{lbl:rc.otherLbl||'Other income',amt:rc.other||0}]};lsSet(SK.s,cfg);}
  else cfg=rc;
  if(!Array.isArray(cfg.incSources)||cfg.incSources.length===0){cfg.incSources=[{lbl:'Salary',amt:0},{lbl:'Other income',amt:0}];lsSet(SK.s,cfg);}
  notes=lsGet(SK.n,{});
}

var incRows=[],expRows=DEFEXP.map(function(l){return{lbl:l,amt:0};});
var curTab='Budget',ch={},debT=null,loanDebT=null;
var now=new Date(),selM=now.getMonth(),selY=now.getFullYear(),investView='10';

/* ── Utilities ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function totalBaseIncome(){return(cfg.incSources||[]).reduce(function(s,r){return s+(parseFloat(r.amt)||0);},0);}
function fmtE(n){return EUR+Math.round(Math.max(0,n)).toLocaleString('de-DE');}
function fmtS(n){return(n<0?'-'+EUR:EUR)+Math.abs(Math.round(n)).toLocaleString('de-DE');}
function sumAmt(arr){return arr.reduce(function(s,r){return s+(parseFloat(r.amt)||0);},0);}
function isDark(){return matchMedia('(prefers-color-scheme:dark)').matches;}
function tc(){return isDark()?'#a0a0a0':'#6A6A6A';}
function gc(){return isDark()?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)';}
function pad2(n){return n<10?'0'+n:''+n;}
function curKey(){return selY+'-'+pad2(selM);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,parseFloat(v)||0));}
function toast(msg){var t=document.getElementById('tst');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2400);}
function mkChart(id,cfg2){if(typeof Chart==='undefined')return;if(ch[id]){ch[id].destroy();delete ch[id];}var el=document.getElementById(id);if(el)ch[id]=new Chart(el,cfg2);}
function debounce(){clearTimeout(debT);debT=setTimeout(updMets,150);}
function loanDebounce(){clearTimeout(loanDebT);loanDebT=setTimeout(function(){lsSet(SK.l,loans);},400);}
function met(lbl,cls,val){return'<div class="met"><div class="met-l">'+lbl+'</div><div class="met-v '+cls+'">'+esc(val)+'</div></div>';}

/* Safe math evaluator for amount fields.
   Allows: digits, + - * / ( ) . and whitespace.
   Returns null if invalid; otherwise the numeric result clamped to >= 0. */
function evalAmount(expr){
  if(expr==null)return null;
  var s=String(expr).trim();
  if(s==='')return 0;
  if(!/^[0-9+\-*/().\s]+$/.test(s))return null;
  if(/[+\-*/]{2,}/.test(s.replace(/--/g,'-')))return null;
  try{
    var result=Function('"use strict";return ('+s+')')();
    if(typeof result!=='number'||!isFinite(result))return null;
    return Math.max(0,Math.round(result*100)/100);
  }catch(e){return null;}
}

/* Annuity formula: P·r/(1-(1+r)^-n) */
function monthlyPmt(balance,annualRate,n){
  if(!balance||!n)return 0;
  if(!annualRate)return balance/n;
  var r=annualRate/100/12;
  return balance*r/(1-Math.pow(1+r,-n));
}
/* Future value of monthly annuity at annual rate over years */
function fvAnnuity(pmt,annualRate,years){
  var r=annualRate/100/12,n=years*12;
  if(r===0)return pmt*n;
  return pmt*(Math.pow(1+r,n)-1)/r;
}
/* Total monthly loan payments across all loans */
function totalLoanPayments(){
  return loans.reduce(function(s,l){
    return s+monthlyPmt(l.balance||0,l.rate||0,l.inst||0);
  },0);
}

/* ── Export / Import / Settings ── */
function exportData(){
  var blob=new Blob([JSON.stringify({version:11,exported:new Date().toISOString(),history:finHistory,loans:loans,settings:cfg,notes:notes},null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='finance-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('Exported');
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(!d.history||!Array.isArray(d.history))throw new Error('Invalid file');
        if(!confirm('Import replaces all data. Continue?'))return;
        finHistory=d.history||[];loans=d.loans||DEFLOAN;notes=d.notes||{};
        if(d.settings&&d.settings.incSources)cfg=d.settings;
        else if(d.settings)cfg={incSources:[{lbl:'Salary',amt:d.settings.sal||d.settings.normalIncome||0},{lbl:d.settings.otherLbl||'Other income',amt:d.settings.other||0}]};

function bldRows(type){
  /* Full rebuild — used only on initial render, tab switch, or month change.
     For incremental add/remove, use appendOneRow / removeOneRow which preserve focus. */
  var data=type==='i'?incRows:expRows;
  var el=document.getElementById(type==='i'?'ir':'er');if(!el)return;
  el.innerHTML='';
  data.forEach(function(_,i){el.appendChild(buildRowEl(type,i));});
  updOverBudget();
}

function buildRowEl(type,i){
  /* Build a single row DOM element bound to data[i] by index.
     The closure captures `type` and `i` — both are stable refs to the array slot. */
  var data=type==='i'?incRows:expRows;
  var item=data[i];
  var d=document.createElement('div');
  d.className='irow';
  d.setAttribute('data-row-type',type);
  d.setAttribute('data-row-idx',i);

  var tx=document.createElement('input');
  tx.type='text';
  tx.placeholder=type==='i'?'Source':'Category';
  tx.value=item.lbl||'';
  tx.autocomplete='off';
  tx.addEventListener('input',function(e){
    /* Read live idx from DOM attribute — survives reindexing on row removal */
    var idx=parseInt(d.getAttribute('data-row-idx'),10);
    var arr=type==='i'?incRows:expRows;
    if(arr[idx])arr[idx].lbl=e.target.value;
    debounce();
  });

  var nm=document.createElement('input');
  /* type="text" with inputmode="decimal" allows arithmetic expressions like "120+180"
     while still showing the numeric keypad on mobile. Native type="number" rejects + sign. */
  nm.type='text';nm.placeholder='0';
  nm.setAttribute('inputmode','decimal');
  nm.setAttribute('autocomplete','off');
  nm.value=item.amt||'';
  nm.addEventListener('focus',function(){if(parseFloat(this.value)===0)this.value='';});
  nm.addEventListener('blur',function(){
    /* Evaluate arithmetic expression on blur — "120+180+45" becomes 345 */
    var idx=parseInt(d.getAttribute('data-row-idx'),10);
    var arr=type==='i'?incRows:expRows;
    var result=evalAmount(this.value);
    if(result===null){
      /* Invalid expression — revert to stored value */
      this.value=arr[idx]?(arr[idx].amt||0):0;
    }else{
      this.value=result===0?'0':String(result);
      if(arr[idx])arr[idx].amt=result;
    }
    debounce();
  });
  /* Enter key triggers blur (which runs evaluation) */
  nm.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();this.blur();}});
  nm.addEventListener('input',function(e){
    /* Mid-typing: only sync state if the value is a clean number (no operators yet).
       If user is mid-expression like "120+", don't write garbage to state. */
    var idx=parseInt(d.getAttribute('data-row-idx'),10);
    var arr=type==='i'?incRows:expRows;
    var v=e.target.value;
    /* Plain number? Update state. Has operators? Wait for blur. */
    if(/^-?\d*\.?\d*$/.test(v)){
      if(arr[idx])arr[idx].amt=parseFloat(v)||0;
      debounce();
    }
  });

  var qb=document.createElement('button');
  qb.className='qabtn';qb.setAttribute('aria-label','Quick add/subtract');qb.textContent='+';
  qb.addEventListener('click',function(){
    var idx=parseInt(d.getAttribute('data-row-idx'),10);
    toggleQuickAdd(type,idx,d);
  });

  var xb=document.createElement('button');
  xb.className='xbtn';xb.setAttribute('aria-label','Remove');xb.textContent='\u2715';
  xb.addEventListener('click',function(){
    var idx=parseInt(d.getAttribute('data-row-idx'),10);
    removeOneRow(type,idx);
  });

  d.appendChild(tx);d.appendChild(nm);d.appendChild(qb);d.appendChild(xb);
  return d;
}

/* ── Quick-add overlay ── */
var qaState={mode:'add'};  /* 'add' or 'sub' — persists across opens within a session */

function closeQuickAdd(){
  var existing=document.querySelectorAll('.qa-overlay');
  existing.forEach(function(el){el.parentNode.removeChild(el);});
}

function toggleQuickAdd(type,idx,rowEl){
  /* If an overlay is already attached to this row, close it (toggle off) */
  var next=rowEl.nextElementSibling;
  if(next&&next.classList.contains('qa-overlay')&&next.getAttribute('data-qa-type')===type&&parseInt(next.getAttribute('data-qa-idx'),10)===idx){
    closeQuickAdd();return;
  }
  /* Otherwise close any open overlay and open a new one */
  closeQuickAdd();
  openQuickAdd(type,idx,rowEl);
}

function openQuickAdd(type,idx,rowEl){
  var arr=type==='i'?incRows:expRows;
  if(!arr[idx])return;
  var labelTxt=arr[idx].lbl||(type==='i'?'this source':'this category');

  var ov=document.createElement('div');
  ov.className='qa-overlay'+(qaState.mode==='sub'?' sub':'');
  ov.setAttribute('data-qa-type',type);
  ov.setAttribute('data-qa-idx',idx);

  var lbl=document.createElement('span');
  lbl.className='qa-label';
  lbl.textContent=(qaState.mode==='sub'?'Subtract from ':'Add to ')+labelTxt+':';

  var modeBtn=document.createElement('button');
  modeBtn.className='qa-mode'+(qaState.mode==='sub'?' sub':'');
  modeBtn.textContent=qaState.mode==='sub'?'\u2212':'+';
  modeBtn.setAttribute('aria-label','Toggle add/subtract');

  var input=document.createElement('input');
  input.className='qa-input';input.type='text';
  input.setAttribute('inputmode','decimal');input.setAttribute('autocomplete','off');
  input.placeholder='0';

  var okBtn=document.createElement('button');
  okBtn.className='qa-ok';okBtn.textContent='\u2713';
  okBtn.setAttribute('aria-label','Confirm');

  var cancelBtn=document.createElement('button');
  cancelBtn.className='qa-cancel';cancelBtn.textContent='\u2715';
  cancelBtn.setAttribute('aria-label','Cancel');

  /* Toggle handler — switches mode and updates the entire overlay style */
  modeBtn.addEventListener('click',function(){
    qaState.mode=qaState.mode==='add'?'sub':'add';
    var isSub=qaState.mode==='sub';
    ov.classList.toggle('sub',isSub);
    modeBtn.classList.toggle('sub',isSub);
    modeBtn.textContent=isSub?'\u2212':'+';
    lbl.textContent=(isSub?'Subtract from ':'Add to ')+labelTxt+':';
    input.focus();
  });

  function applyQuickAdd(){
    var val=evalAmount(input.value);
    if(val===null||val===0){closeQuickAdd();return;}
    var arr=type==='i'?incRows:expRows;
    if(!arr[idx]){closeQuickAdd();return;}
    var current=arr[idx].amt||0;
    var newVal=qaState.mode==='sub'?current-val:current+val;
    newVal=Math.max(0,Math.round(newVal*100)/100);
    arr[idx].amt=newVal;
    /* Update the corresponding amount input in the row */
    var amtInput=rowEl.querySelectorAll('input')[1];
    if(amtInput)amtInput.value=newVal===0?'0':String(newVal);
    closeQuickAdd();
    debounce();
    toast((qaState.mode==='sub'?'\u2212':'+')+fmtE(val)+' \u2192 '+fmtE(newVal));
  }

  okBtn.addEventListener('click',applyQuickAdd);
  cancelBtn.addEventListener('click',closeQuickAdd);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();applyQuickAdd();}
    else if(e.key==='Escape'){e.preventDefault();closeQuickAdd();}
  });

  ov.appendChild(lbl);ov.appendChild(modeBtn);ov.appendChild(input);ov.appendChild(okBtn);ov.appendChild(cancelBtn);
  rowEl.parentNode.insertBefore(ov,rowEl.nextSibling);
  setTimeout(function(){input.focus();},50);
}

function reindexRows(type){
  /* After insert/delete, refresh data-row-idx on all rows so their event handlers
     read the correct array slot. This is the key to bug-free incremental updates. */
  var el=document.getElementById(type==='i'?'ir':'er');if(!el)return;
  var rows=el.querySelectorAll('.irow');
  rows.forEach(function(row,i){row.setAttribute('data-row-idx',i);});
}

function appendOneRow(type){
  /* Append a single new row to the DOM — does NOT touch existing rows.
     Existing input focus, values, and IME state are preserved. */
  var arr=type==='i'?incRows:expRows;
  arr.push({lbl:'',amt:0});
  var el=document.getElementById(type==='i'?'ir':'er');if(!el)return;
  el.appendChild(buildRowEl(type,arr.length-1));
  updOverBudget();
}

function removeOneRow(type,i){
  /* Remove a single row from DOM + array, then reindex remaining rows.
     Other rows' DOM (and focus/value) is untouched. */
  var arr=type==='i'?incRows:expRows;
  if(i<0||i>=arr.length)return;
  arr.splice(i,1);
  var el=document.getElementById(type==='i'?'ir':'er');if(!el)return;
  var rows=el.querySelectorAll('.irow');
  if(rows[i])el.removeChild(rows[i]);
  reindexRows(type);
  debounce();
}

function addR(t){appendOneRow(t);}
function remR(t,i){removeOneRow(t,i);}
function updL(t,i,v){var arr=t==='i'?incRows:expRows;if(arr[i])arr[i].lbl=v;debounce();}
function updA(t,i,v){var arr=t==='i'?incRows:expRows;if(arr[i])arr[i].amt=parseFloat(v)||0;debounce();}

/* Toggle .ob over-budget highlight on existing rows WITHOUT rebuilding them.
   This preserves input focus so the user can keep typing. */

  });
}

/* ══════════════════════════════════════════════
   TAB 2 — ADVISOR (debt-aware allocation)
══════════════════════════════════════════════ */
function rAdvisor(root){
  var ni=totalBaseIncome(),hasH=finHistory.length>0;
  var avgExp=hasH?Math.round(finHistory.reduce(function(s,h){return s+h.expenses;},0)/finHistory.length):0;
  var td=loans.reduce(function(s,l){return s+(l.balance||0);},0);
  var nb=hasH?ni-avgExp:null,efTarget=hasH?avgExp*3:0;
  var loanPmt=totalLoanPayments();
  var discr=Math.max(0,ni-loanPmt);
  /* Highest-rate loan for priority targeting */
  var topLoan=loans.reduce(function(a,b){return(a.rate||0)>=(b.rate||0)?a:b;});
  var recInvest=Math.round(discr*0.15),recSave=Math.round(discr*0.25),recExtra=Math.round(discr*0.10);
  var planCost=recInvest+recSave+recExtra;
  var feasible=nb!==null?nb>=planCost:null;
  var srcHtml='';
  (cfg.incSources||[]).forEach(function(src,i){
    srcHtml+='<div class="irow">'
      +'<input type="text" placeholder="Source name" value="'+esc(src.lbl)+'" oninput="updIncSrc('+i+',\'lbl\',this.value)" style="flex:1;font-size:14px"/>'

function updIncSrc(i,field,v){

  var nb=hasH?ni-avgExp:null,efTarget=hasH?avgExp*3:0,planCost=Math.round(discr*0.30),feasible=nb!==null?nb>=planCost:null;

  var fb=document.getElementById('adv-feas');

}

      +'<div style="background:'+(hi?'var(--rl)':'var(--gll)')+';color:'+(hi?'var(--rd)':'var(--gray)')+';font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;flex-shrink:0">'+l.rate+'%</div></div>'
      +'<div class="g2" style="margin-bottom:8px">'+lf('Balance ('+EUR+')','balance',l.balance,i,false)+lf('Interest (%)','rate',l.rate,i,true)+lf('Monthly ('+EUR+')','monthly',l.monthly,i,false)+lf('Installments left','inst',l.inst,i,false)+'</div>'
      +'<div style="font-size:11px;color:var(--tm)">Est. monthly payment: <strong style="color:var(--red)">'+fmtE(pmt)+'</strong> | Monthly interest: <strong style="color:var(--rd)">'+fmtE(mi)+'</strong></div>'
      +'<div class="pb"><div class="pf" style="width:'+pct+'%;background:'+(hi?'#E60000':'#A32D2D')+'"></div></div>'
      +'<div style="font-size:10px;color:var(--tm);margin-top:2px">'+pct+'% of total debt</div>'
      +(hi?'<div style="margin-top:8px;background:var(--rl);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--rd)">Rate above 5% — overpaying saves significant interest</div>':'')+'</div>';
  });
  var totalPmt=totalLoanPayments();
  html+='<div class="disc">Total estimated monthly payments: <strong>'+fmtE(totalPmt)+'</strong></div>'
    +'<div class="card"><div class="lbl" style="margin-bottom:8px">Debt breakdown</div><div class="cw"><canvas id="dbtC" role="img" aria-label="Debt breakdown"></canvas></div></div>';
  root.innerHTML=html;
  mkChart('dbtC',{type:'doughnut',data:{labels:loans.map(function(l){return l.name;}),datasets:[{data:loans.map(function(l){return l.balance||0;}),backgroundColor:['#E60000','#A32D2D','#6A6A6A'],borderWidth:2,borderColor:isDark()?'#2a2a2a':'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{labels:{color:isDark()?'#f0f0f0':'#1a1a1a',font:{size:11}}},tooltip:{callbacks:{label:function(ctx){return' '+ctx.label+': '+fmtE(ctx.parsed);}}}}}});
}
function lf(lbl,field,val,i,isStep){
  /* Decimal precision: rate (isStep), balance and monthly all accept 0.01 step.
     Only 'inst' (installments) stays integer since you can't have fractional installments. */
  var step=(isStep||field==='balance'||field==='monthly')?' step="0.01"':' step="1"';
  var imode=field==='inst'?'numeric':'decimal';
  return'<div style="background:var(--gll);border-radius:6px;padding:8px"><div style="font-size:10px;color:var(--tm);margin-bottom:3px">'+lbl+'</div><input class="ie" type="number"'+step+' inputmode="'+imode+'" min="0"'+(field==='rate'?' max="50"':'')+' value="'+(val||0)+'" onfocus="if(parseFloat(this.value)===0)this.value=\'\'" onblur="if(this.value===\'\')this.value=\'0\'" oninput="updL('+i+',\''+field+'\',this.value)"/></div>';
}
function updL(i,f,v){var n=f==='rate'?clamp(v,0,50):Math.max(0,parseFloat(v)||0);loans[i][f]=n;loanDebounce();}
function updLName(i,v){loans[i].name=v;loanDebounce();}

function rAnalysis(root){
  if(!finHistory.length){root.innerHTML='<div class="card" style="text-align:center;padding:24px;color:var(--tm)">No data yet. Save a month first.</div>';return;}

    var over=actual>target,pct=target>0?Math.min((actual/target)*100,150):0;
    html+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>'+esc(cat)+'</span><span style="font-weight:600;color:'+(over?'var(--rd)':'var(--green)')+'">'+fmtE(actual)+' / '+fmtE(target)+(over?' !':' OK')+'</span></div><div class="pb"><div class="pf" style="width:'+pct+'%;background:'+(over?'#E60000':'#0F6E56')+'"></div></div></div>';
  });

  finHistory.forEach(function(h){var bc=h.balance>=0?'pos':'neg';html+='<div class="hi"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:13px">'+esc(h.mo)+' '+h.yr+'</span><div style="display:flex;gap:6px"><span class="bdg '+bc+'">'+fmtS(h.balance)+'</span><span class="bdg '+bc+'">'+h.rate.toFixed(1)+'%</span></div></div><div style="font-size:12px;color:var(--tm);margin-top:3px">In: '+fmtE(h.income)+' | Out: '+fmtE(h.expenses)+'</div></div>';});

    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc(),font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{color:tc(),callback:function(v){return EUR+v.toLocaleString('de-DE');}},grid:{color:gc()}},x:{ticks:{color:tc(),font:{size:10}},grid:{display:false}}}}});
}

/* ══════════════════════════════════════════════
   TAB 6 — INVESTMENTS (income-aware, debt-aware, Buffett-calibrated)
══════════════════════════════════════════════ */
function rInvest(root){
  var ni=totalBaseIncome();
  var loanPmt=totalLoanPayments();
  var discr=Math.max(0,ni-loanPmt);
  var totalDebt=loans.reduce(function(s,l){return s+(l.balance||0);},0);

  /* ── Three investment tiers, all debt-aware ── */
  /* Minimum: 10% of discretionary */
  var minInvest=Math.round(discr*0.10);
  var minSave=Math.round(discr*0.15);
  var minLiving=discr-minInvest-minSave;

  /* Recommended (FA standard): 15% invest, 25% save, 10% extra debt */
  var recInvest=Math.round(discr*0.15);
  var recSave=Math.round(discr*0.25);
  var recExtra=Math.round(discr*0.10);
  var recLiving=discr-recInvest-recSave-recExtra;

  /* Buffett: 20% invest, 30% save */
  var bufInvest=Math.round(discr*0.20);
  var bufSave=Math.round(discr*0.30);
  var bufLiving=discr-bufInvest-bufSave;

  /* Portfolio split for recommended tier */
  var cspx=Math.round(recInvest*0.70),bonds=Math.round(recInvest*0.20),cash=recInvest-cspx-bonds;

  /* Warn if living costs go negative */
  function warnNeg(v){return v<0?'<div class="warn-pill">Shortfall of '+fmtE(Math.abs(v))+'</div>':'';}

  var years=parseInt(investView,10);
  var scenarios=[{lbl:'Bear (3%)',r:3,col:'#ACACAC'},{lbl:'Base (10%)',r:10,col:'#0F6E56'},{lbl:'Bull (12%)',r:12,col:'#185FA5'}];
  var gd=Array.from({length:years},function(_,i){
    var n=i+1,row={yr:'Y'+n,con:recInvest*12*n};
    scenarios.forEach(function(s){row[s.lbl]=Math.round(fvAnnuity(recInvest,s.r,n));});
    return row;
  });
  var last=gd[gd.length-1];

  /* Allocation bar segments */
  var allocItems=[
    {label:'Loans',val:loanPmt,col:'#A32D2D'},
    {label:'Living',val:Math.max(0,recLiving),col:'#6A6A6A'},
    {label:'Debt extra',val:recExtra,col:'#993C1D'},
    {label:'Save',val:recSave,col:'#E60000'},
    {label:'Invest',val:recInvest,col:'#0F6E56'},
  ];
  var allocTotal=allocItems.reduce(function(s,x){return s+x.val;},0);
  var allocBar=allocTotal>0?allocItems.map(function(x){return'<div class="alloc-seg" style="width:'+((x.val/allocTotal)*100).toFixed(1)+'%;background:'+x.col+'"></div>';}).join(''):'';
  var allocLeg=allocTotal>0?allocItems.map(function(x){return'<span class="alloc-li"><span class="alloc-dot" style="background:'+x.col+'"></span>'+x.label+': '+fmtE(x.val)+' ('+((x.val/allocTotal)*100).toFixed(0)+'%)</span>';}).join(''):'';

  var html='<div class="disc">General information only — not regulated financial advice. Investments can fall as well as rise. Past performance does not guarantee future returns.</div>';

  /* Income summary bar */
  html+='<div class="card" style="background:var(--gll);margin-bottom:12px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:8px">Your numbers</div>'
    +'<div class="g2">'
    +met('Monthly income','pos',fmtE(ni))
    +met('Loan payments','neg',fmtE(loanPmt))
    +met('Discretionary','pos',fmtE(discr))
    +met('Total debt','neg',fmtE(totalDebt))
    +'</div>'
    +'<div style="font-size:11px;color:var(--tm)">Discretionary = income minus committed loan payments. All tiers below split this amount only.</div>'
    +'</div>';

  /* Debt priority */
  html+='<div class="alert" style="margin-bottom:12px"><strong style="display:block;margin-bottom:4px">⚠ Active debt — pay in this order (highest rate first):</strong>';
  var sortedLoans=loans.slice().sort(function(a,b){return(b.rate||0)-(a.rate||0);});
  sortedLoans.forEach(function(l,i){
    if(!l.balance)return;
    var pmt=monthlyPmt(l.balance,l.rate,l.inst);
    html+=''+(i+1)+'. '+esc(l.name)+' — '+l.rate+'% · '+fmtE(l.balance)+' remaining · ~'+fmtE(pmt)+'/mo<br>';
  });
  html+='</div>';

  /* Three tier cards */
  html+='<div class="lbl">How much should you invest?</div>'
    +'<div class="tier min">'
    +'<div class="tier-hd"><span class="tier-tt">Minimum safe floor</span><span class="tier-tg">Start here if tight</span></div>'
    +'<div class="tier-row"><span>Loan payments (committed)</span><strong>'+fmtE(loanPmt)+'</strong></div>'
    +'<div class="tier-row"><span>Living costs</span><strong>'+fmtE(Math.max(0,minLiving))+'</strong></div>'
    +'<hr class="tier-div"/>'
    +'<div class="tier-row"><span>Save per month</span><strong>'+fmtE(minSave)+'</strong></div>'
    +'<div class="tier-row"><span>Invest per month</span><strong>'+fmtE(minInvest)+'</strong></div>'
    +warnNeg(minLiving)
    +'<div class="tier-qt">Even '+fmtE(minInvest)+'/month at 7% grows to '+fmtE(Math.round(fvAnnuity(minInvest,7,10)))+' in 10 years.</div>'
    +'</div>'

    +'<div class="tier rec">'
    +'<div class="tier-hd"><span class="tier-tt" style="color:var(--red)">Recommended — FA standard</span><span class="tier-tg r">Target this</span></div>'
    +'<div class="tier-row"><span>Loan payments (committed)</span><strong>'+fmtE(loanPmt)+'</strong></div>'
    +'<div class="tier-row"><span>Living costs</span><strong>'+fmtE(Math.max(0,recLiving))+'</strong></div>'
    +'<div class="tier-row"><span>Extra debt repayment</span><strong>'+fmtE(recExtra)+'</strong></div>'
    +'<hr class="tier-div"/>'
    +'<div class="tier-row"><span>Save per month</span><strong class="r">'+fmtE(recSave)+'</strong></div>'
    +'<div class="tier-row"><span>Invest per month</span><strong class="r">'+fmtE(recInvest)+'</strong></div>'
    +warnNeg(recLiving)
    +'<div class="tier-qt">Saves '+fmtE(recSave*12)+'/year. '+fmtE(recInvest)+'/month → '+fmtE(Math.round(fvAnnuity(recInvest,7,10)))+' in 10 years at 7%.</div>'
    +'</div>'

    +'<div class="tier buf">'
    +'<div class="tier-hd"><span class="tier-tt" style="color:var(--green)">Buffett level</span><span class="tier-tg g">Wealth-building</span></div>'
    +'<div class="tier-row"><span>Loan payments (committed)</span><strong>'+fmtE(loanPmt)+'</strong></div>'
    +'<div class="tier-row"><span>Living costs</span><strong>'+fmtE(Math.max(0,bufLiving))+'</strong></div>'
    +'<hr class="tier-div"/>'
    +'<div class="tier-row"><span>Save per month</span><strong class="g">'+fmtE(bufSave)+'</strong></div>'
    +'<div class="tier-row"><span>Invest per month</span><strong class="g">'+fmtE(bufInvest)+'</strong></div>'
    +warnNeg(bufLiving)
    +'<div class="tier-qt">"Do not save what is left after spending — spend what is left after saving." '+fmtE(bufInvest)+'/month → '+fmtE(Math.round(fvAnnuity(bufInvest,7,10)))+' in 10 years. Index funds, hold forever.</div>'
    +'</div>';

  /* Allocation bar */
  html+='<div class="lbl">Recommended allocation (% of total income)</div>'
    +'<div class="card"><div class="alloc-bar">'+allocBar+'</div><div class="alloc-leg">'+allocLeg+'</div></div>';

  /* Buffett quote */
  html+='<div class="card" style="background:var(--gll);margin-bottom:12px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:6px">Buffett\'s actual advice</div>'
    +'<div style="font-size:12px;color:var(--tm);line-height:1.5">"Put 10% in short-term government bonds and 90% in a very low-cost S&P 500 index fund." — Warren Buffett, 2013 Berkshire letter.</div></div>';

  /* Portfolio breakdown */
  html+='<div class="lbl">Buffett-aligned allocation — '+fmtE(recInvest)+'/month</div>';
  [{t:'CSPX',a:cspx,p:70,d:"iShares S&P 500 — 0.07% fee. Buffett's recommended vehicle.",col:'#E60000'},
   {t:'IGIL',a:bonds,p:20,d:'Global Inflation-Linked Bond ETF — stability and inflation protection.',col:'#6A6A6A'},
   {t:'Cash',a:cash,p:10,d:'IBKR cash management — ~3-4% yield, instant access.',col:'#ACACAC'}
  ].forEach(function(r){html+='<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px"><div style="width:44px;height:44px;border-radius:8px;background:'+r.col+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;text-align:center;flex-shrink:0">'+r.t+'</div><div><div style="font-size:13px;font-weight:600">'+r.t+' <span style="color:var(--green)">'+fmtE(r.a)+'/mo ('+r.p+'%)</span></div><div style="font-size:11px;color:var(--tm)">'+r.d+'</div></div></div>';});

  /* Growth chart */
  html+='<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn sm'+(investView==='10'?' p':'')+'" onclick="setIView(\'10\')">10-year</button><button class="btn sm'+(investView==='20'?' p':'')+'" onclick="setIView(\'20\')">20-year</button></div>'
    +'<div class="card"><div class="cw"><canvas id="grwC" role="img" aria-label="Investment growth"></canvas></div>'
    +'<div style="font-size:11px;color:var(--tm);margin-top:8px">Bear 3%: <strong>'+fmtE(last[scenarios[0].lbl])+'</strong> | Base 10%: <strong style="color:var(--green)">'+fmtE(last[scenarios[1].lbl])+'</strong> | Bull 12%: <strong style="color:#185FA5">'+fmtE(last[scenarios[2].lbl])+'</strong> vs '+fmtE(last.con)+' contributed</div></div>';

  /* IB setup */
  html+='<div class="card" style="background:var(--gl);border:.5px solid var(--green)"><div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">Interactive Brokers — setup</div>';
  ['Login to IB — search CSPX','Set recurring monthly buy: '+fmtE(cspx)+' on the 20th','Search IGIL — set '+fmtE(bonds)+' recurring on the 20th','Keep '+fmtE(cash)+' in IBKR cash (~3-4% yield)','Review quarterly — rebalance annually if drift exceeds 5%','Never sell during market dips — time in market beats timing'].forEach(function(s){html+='<div style="font-size:12px;color:var(--gray);margin-bottom:4px">'+s+'</div>';});
  html+='</div>';

  /* Q&A */
  html+='<div class="lbl">Ask Warren — Q&amp;A</div><div class="card"><div style="font-size:12px;color:var(--tm);margin-bottom:10px">Tap any question for the answer.</div>';
  QA.forEach(function(item,i){html+='<button class="qa-btn" onclick="toggleQA('+i+')">'+esc(item.q)+'</button><div class="qa-ans" id="qa-'+i+'">'+esc(item.a)+'</div>';});
  html+='</div>';

  /* Investment notes */
  html+='<div class="lbl">Investment notes</div><div class="card"><textarea class="ta" id="inote" placeholder="Track portfolio, decisions...">'+esc(notes['invest']||'')+'</textarea><button class="btn p sm" style="margin-top:8px;flex:none;width:auto" onclick="svINote()">Save note</button></div>';

  root.innerHTML=html;

  var ds=scenarios.map(function(s){return{label:s.lbl,data:gd.map(function(d){return d[s.lbl];}),borderColor:s.col,tension:.4,fill:false,pointRadius:3};});
  ds.push({label:'Contributed',data:gd.map(function(d){return d.con;}),borderColor:'#D6D6D6',borderDash:[5,5],fill:false,tension:.4,pointRadius:0});
  mkChart('grwC',{type:'line',data:{labels:gd.map(function(d){return d.yr;}),datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc(),font:{size:11}}}},scales:{y:{ticks:{color:tc(),callback:function(v){return EUR+(v/1000).toFixed(0)+'k';}},grid:{color:gc()}},x:{ticks:{color:tc()},grid:{display:false}}}}});
}
function setIView(v){investView=v;go('Investments');}
function toggleQA(i){var el=document.getElementById('qa-'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function svINote(){var el=document.getElementById('inote');if(el){notes['invest']=el.value;lsSet(SK.n,notes);toast('Note saved');}}

/* ══════════════════════════════════════════════
   TAB 7 — SETTINGS
══════════════════════════════════════════════ */
function rSettings(root){
  root.innerHTML='<div class="lbl">Data management</div>'
    +'<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Export backup</div><div style="font-size:12px;color:var(--tm);margin-bottom:10px">Download all data as JSON. Back up or transfer to a new device.</div><button class="btn g" onclick="exportData()">Download backup (.json)</button></div>'
    +'<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Import backup</div><div style="font-size:12px;color:var(--tm);margin-bottom:10px">Restore from a previously exported JSON file. Replaces all current data.</div><button class="btn" onclick="importData()">Import from file</button></div>'
    +'<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:4px">Storage usage</div>'+storageInfo()+'<div style="font-size:12px;color:var(--tm);margin-top:8px">'+finHistory.length+' months | '+Object.keys(notes).length+' notes</div></div>'
    +'<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:6px">Reset all data</div><div style="font-size:12px;color:var(--tm);margin-bottom:10px">Permanently delete everything. Export first.</div><button class="btn d" onclick="resetAll()">Reset all data</button></div>'
    +'<div class="disc" style="margin-top:4px">Version 11 | Data stored locally in your browser. Export regularly.</div>';
}
function resetAll(){
  if(!confirm('Delete ALL data? Export a backup first.'))return;
  if(!confirm('Are you sure? Cannot be undone.'))return;
  [SK.h,SK.l,SK.s,SK.n].forEach(function(k){localStorage.removeItem(k);});
  loadState();incRows=[];expRows=DEFEXP.map(function(l){return{lbl:l,amt:0};});curTab='Budget';render();toast('All data reset');
}

/* Pre-fill incRows on first load — either from saved month or from cfg.incSources */
function initRowsForCurrentMonth(){
  var key=curKey(),saved=null;
  for(var i=0;i<finHistory.length;i++){if(finHistory[i].key===key){saved=finHistory[i];break;}}
  if(saved){
    incRows=JSON.parse(JSON.stringify(saved.ir));
    expRows=JSON.parse(JSON.stringify(saved.er));
  }else{
    incRows=(cfg.incSources||[]).map(function(s){return{lbl:s.lbl,amt:s.amt};});
    expRows=DEFEXP.map(function(l){return{lbl:l,amt:0};});
  }
}

/* ── Boot ── */
function boot(){
  try{loadState();initRowsForCurrentMonth();render();}
  catch(e){
    try{localStorage.removeItem(SK.s);loadState();initRowsForCurrentMonth();render();toast('Settings reset');}
    catch(e2){
      var hs=document.getElementById('hsub'),rt=document.getElementById('root');
      if(hs)hs.textContent='Error — please reload';
      if(rt)rt.innerHTML='<div style="padding:20px;font-size:14px;color:#A32D2D">Error: '+e2.message+'<br/><br/><button onclick="location.reload()" style="padding:10px 20px;background:#E60000;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Reload</button></div>';
    }
  }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
</script>
</body>
</html>
